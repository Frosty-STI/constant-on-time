name: Desktop executable

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "desktop/**"
      - "packages/sim-core/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-build.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "desktop/**"
      - "packages/sim-core/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-build.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portable:
    name: Windows portable executable
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Test desktop security helpers
        run: npm run desktop:test

      - name: Audit desktop dependencies
        run: npm run desktop:audit

      - name: Build web application
        run: npm run build

      - name: Smoke-test Electron runtime
        run: npm --prefix desktop run smoke

      - name: Build portable executable
        run: npm --prefix desktop run dist

      - name: Smoke-test packaged executable
        run: npm --prefix desktop run smoke:exe

      - name: Record artifact checksum
        shell: pwsh
        run: |
          $artifact = Get-ChildItem -LiteralPath release -Filter *.exe | Select-Object -First 1
          if (-not $artifact) { throw "Portable executable was not produced." }
          $hash = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash
          "### Windows executable" >> $env:GITHUB_STEP_SUMMARY
          "- File: ``$($artifact.Name)``" >> $env:GITHUB_STEP_SUMMARY
          "- Size: $($artifact.Length) bytes" >> $env:GITHUB_STEP_SUMMARY
          "- SHA-256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: constant-on-time-lab-windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
